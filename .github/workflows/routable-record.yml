# Records the Linux side of the routable-command kill test
# (arch/jitk/grow/routable.ts): every workload in grow/routable/workloads.json
# runs once on GitHub's Linux arm64 runner with JITK_ORACLE=record, then again
# with JITK_ORACLE=verify, so a workload whose Linux output is not reproducible
# fails here. Uploads the store as the artifact `routable-golden`; commit its
# new recordings into grow/oracle-golden, then run the guest side on the Mac
# (build/routable with JITK_ORACLE=replay). Run by hand (workflow_dispatch).
name: routable-record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routable:
    name: record routable workloads on linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      JITK_CACHE: /home/runner/.cache/jitk
      JITK_NPM_CACHE: /home/runner/.cache/jitk-npm
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Native tools
        run: |
          missing=
          for pair in cc:build-essential clang:clang ld.lld:lld llvm-objcopy:llvm flock:util-linux xz:xz-utils curl:curl git:git; do
            command -v "${pair%%:*}" >/dev/null 2>&1 || missing="$missing ${pair#*:}"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update -q
            # shellcheck disable=SC2086 # one word per package
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $missing
          fi
          for path in $(type -ap npm npx corepack node); do sudo rm -f "$path"; done
          hash -r

      - name: Rust toolchain (musl target for grow/oracle-root)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/dist/aarch64-unknown-linux-gnu/rustup-init
            sh -c 'chmod +x "$1" && "$1" -y --no-modify-path --profile minimal --default-toolchain none' _ "$RUNNER_TEMP/rustup-init"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sh arch/jitk/tools/rust-toolchain.sh)" --profile minimal \
            --target aarch64-unknown-none --target aarch64-unknown-linux-musl

      - name: Restore caches
        uses: actions/cache/restore@v5
        with:
          path: |
            /home/runner/.cache/jitk
            /home/runner/.cache/jitk-npm
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: jitk-linux-arm64-${{ hashFiles('arch/jitk/tools/deps.json', 'arch/jitk/**/Cargo.lock', 'arch/jitk/**/package-lock.json') }}
          restore-keys: jitk-linux-arm64-

      - name: Routable binaries (pinned, by sha256)
        run: sh arch/jitk/grow/routable/fetch.sh "$RUNNER_TEMP/routable-bin"

      - name: Tools and oracle image
        run: |
          eval "$(make -s -C arch/jitk deps >/dev/null && arch/jitk/tools/.work/bin/deps env)"
          docker build -q -t jitk-oracle:08 arch/jitk/grow/oracle
          make -s -C arch/jitk/grow kernel-tools build/oracle-profile build/routable

      - name: Record, then verify
        run: |
          eval "$(arch/jitk/tools/.work/bin/deps env)"
          cd arch/jitk/grow
          JITK_ORACLE=record build/routable --run-id ci-record --artifacts "$RUNNER_TEMP/routable-bin" --linux-only
          JITK_ORACLE=verify build/routable --run-id ci-verify --artifacts "$RUNNER_TEMP/routable-bin" --linux-only

      - uses: actions/upload-artifact@v7
        with:
          name: routable-golden
          path: arch/jitk/grow/oracle-golden
          retention-days: 30
