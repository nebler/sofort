[package]
name = "jitk-02"
version = "0.3.0"
edition = "2024"
[features]
default = ["qjs"]
qjs = []
transport-ring = ["qjs"]
grow-trace = []
# Diagnostic only: memory syscall trace (src/heap_trace.rs).
heap-trace = ["transport-ring"]
probe = ["qjs"]
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
