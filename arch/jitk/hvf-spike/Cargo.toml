[package]
name = "hvf-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Hypervisor-neutral ring constants, arena classes and payload forwarding come
# from the shard crate itself (all of it builds on macOS); nothing in the shard
# is changed or linked beyond those modules.
[dependencies]
jitk-shard = { path = "../shard" }

[profile.release]
debug = 0
panic = "abort"
