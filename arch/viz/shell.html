<!doctype html><html><head><meta charset="utf-8"><style>
.wrap{font-family:var(--font-sans,system-ui),sans-serif}
.stage{background:#0f1117;border-radius:var(--radius);padding:18px 18px 14px}
.hd{display:flex;justify-content:space-between;align-items:baseline;color:#8b90a0;font-size:13px;margin-bottom:6px;gap:12px}
.hd b{color:#ece9e4;font-weight:600;font-size:16px}
svg{width:100%;height:auto;display:block}
.el{opacity:0;transform:translateY(10px);transform-box:fill-box;transition:opacity .55s ease,transform .55s ease}
.scene.on .el{opacity:1;transform:none}
.scene{visibility:hidden}.scene.on{visibility:visible}
.cap{color:#d9d6d0;font-size:15px;line-height:1.55;min-height:96px;margin-top:8px}
.cap b{color:#f9d65c;font-weight:600}
.ctl{display:flex;gap:8px;align-items:center;margin-top:10px}
.ctl .btn{background:#1c2029;color:#ece9e4;border:1px solid #2c3240;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.ctl .btn:hover{border-color:#58c4dd}
.dots{display:flex;gap:7px;flex:1;justify-content:center;flex-wrap:wrap}
.ctl .dot{width:10px;height:10px;border-radius:50%;background:#30364a;cursor:pointer;border:0;padding:0}
.ctl .dot.on{background:#58c4dd}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted-foreground);font-size:12.5px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
</style></head><body data-debug="__DEBUG__"><div class="wrap">
<div class="stage">
<div class="hd"><b id="ttl"></b><span id="cnt"></span></div>
<svg id="sv" viewBox="0 0 960 540" role="img" aria-label="__ARIA__"></svg>
<div class="cap" id="cap" aria-live="polite"></div>
<div class="ctl"><button class="btn" id="pv">← Prev</button><button class="btn" id="pl">▶ Play</button><div class="dots" id="dots"></div><button class="btn" id="nx">Next →</button></div>
</div><div id="dbg"></div>
<div class="legend"><span><i style="background:#83c167"></i>measured</span><span><i style="background:#58c4dd"></i>built &amp; tested</span><span><i style="background:#f0a35e"></i>target / planned</span><span><i style="background:#8b90a0"></i>reported by others</span><span>← → keys or the dots to step through</span></div>
</div>
<script>
__ENGINE__
__SCENES__
run(SC);
</script></body></html>
